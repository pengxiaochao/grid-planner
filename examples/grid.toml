# 演示价格，不是当前 BTC 报价；运行前换成你看到的现价。
# 本次允许投入的上限，单位 USDT；风险约束可能使实际投入更少。
capital = 600.0
# 离线参考现价，单位 USDT/BTC；--live 会用公开报价覆盖。
price = 84000.0
# 账户总资产，单位 USDT；2% 风险基于此值，而非只基于已投入资金。
equity = 600.0
# 大写 USDT 现货交易对，不适用于合约或其他报价币。
symbol = "BTCUSDT"
# percent 按现价百分比展开；也支持 atr / manual，但必填参数不同。
mode = "percent"

# 这里的 2、0.1 均是百分比数值，而不是已经除以 100 的比例。
# 止损情景预算为账户资产的 2%；跳空等实际执行损失仍可能更大。
risk_pct = 2.0
# 每边手续费 0.1%，买卖各计一次；按你的实际费率修改。
fee_pct = 0.1
# 每边额外滑点/成本假设 0.05%，与手续费合计使用。
slippage_pct = 0.05
# 下限从参考现价下移 10%，属于可调区间假设。
down_pct = 10.0
# 上限从参考现价上移 10%。
up_pct = 10.0
# SL 在下限外再下移 3%，TP 在上限外再上移 3%。
outside_pct = 3.0

# 最低网格订单建议金额，单位 USDT；还须满足交易所最低金额。
min_order_usdt = 30.0
# 价格取整后，最差一格双边扣费净收益至少 0.3%。
min_net_pct = 0.3
# 总投入中预留 5% 购买费用预留币；这部分库存也计入下跌风险。
reserve_pct = 5.0
# 压力情景假设卖出价比 SL 再低 5%，便于查看超预算风险。
stress_pct = 5.0
# 自动搜索最多 150 段；实际格数取满足全部约束的最大可行值。
max_grids = 150

# 离线示例规则，不代表币安当前值；--live 会读取公开规则替代这些值。
# 价格最小步长，保留字符串小数位以便准确取整。
tick_size = "0.01"
# 基础币数量最小步长，不是 USDT 金额。
step_size = "0.00001"
# 交易所最低单笔名义金额，单位 USDT；这里仅为示例。
min_notional = 10.0
# 交易所最低单笔 BTC 数量；这里仅为示例。
min_qty = 0.00001

# 要固定格数，取消下一行注释；不可行时程序会报错。
# grids = 3
